<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Learning Progress Dashbord </title>
</head>
<body>
    <div class = 'container'>
        <h1> Learning Progress Dashbord</h1>
        <form id = 'ProgressForm'>
            <lable> Name </lable>
            <input type = "text" id = "name"><br><br>

            <lable> Roll Number </lable>
            <input type ="text" id = "roll_no"><br><br>

            <lable> Topics Compleated </lable>
            <input type = "number" id = "Topic"><br><br>

            <Lable> Hours Practiced </Lable>
            <input type = "number" id = "hours"><br><br>

            <lable>Confidence Rating (1-10)</lable>
            <input type="number" id="rating" min="1" max="10"><br><br>

            <button type = "Submit" > Check Progress </button>

        </form>

        <div id ="result"></div>
        <script src="script.js"></script>
    </div>
</body>
</html>
